version: '3.8'

services:
  findcasa-scraper:
    build: .
    container_name: findcasa-scraper
    restart: unless-stopped
    volumes:
      # Mount local data directory to persist scraped data
      - ./data:/app/data
      # Optional: mount logs directory
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    # Network mode for Tor proxy
    network_mode: "bridge"
    # If you need to expose ports for debugging
    # ports:
    #   - "8080:8080"
