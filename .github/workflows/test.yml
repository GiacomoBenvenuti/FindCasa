name: Run Tests

on:
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]
  push:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tor
        # Start tor service for proxy tests
        sudo systemctl start tor
        sudo systemctl enable tor
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create required directories
      run: |
        mkdir -p data
        mkdir -p logs
        echo "Created data and logs directories"
    
    - name: Run RMVScraper unit tests
      run: |
        # Run the main test suite
        echo "Running RMVScraper comprehensive test suite..."
        python test_rmv_scraper.py
        echo "✅ All tests completed successfully!"

  test-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image for testing
      run: |
        if [ -f "Dockerfile" ]; then
          # Create a test-specific Dockerfile that includes test files
          cat > Dockerfile.test << 'EOF'
        FROM python:3.11-slim

        WORKDIR /app

        # Install system dependencies
        RUN apt-get update && apt-get install -y \
            tor \
            && rm -rf /var/lib/apt/lists/*

        # Copy requirements and install Python dependencies
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt

        # Copy all application files including tests
        COPY . .

        # Create required directories
        RUN mkdir -p /app/data /app/logs

        # Set environment variables
        ENV PYTHONPATH=/app
        ENV PYTHONUNBUFFERED=1
        EOF
          
          docker build -f Dockerfile.test -t findcasa-scraper-test .
        fi
    
    - name: Run tests in Docker container
      run: |
        if [ -f "Dockerfile" ]; then
          docker run --rm findcasa-scraper-test python test_rmv_scraper.py
        fi