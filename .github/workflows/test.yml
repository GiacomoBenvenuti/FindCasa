name: Run Tests

on:
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]
  push:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tor
        # Start tor service for proxy tests
        sudo systemctl start tor
        sudo systemctl enable tor
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install additional testing dependencies
        pip install pytest pytest-cov pytest-mock
    
    - name: Create required directories
      run: |
        mkdir -p data
        mkdir -p logs
    
    - name: Run RMVScraper unit tests
      run: |
        # Run the main test suite
        python test_rmv_scraper.py

  test-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        if [ -f "Dockerfile" ]; then
          docker build -t findcasa-scraper .
        fi
    
    - name: Run tests in Docker container
      run: |
        if [ -f "Dockerfile" ]; then
          docker run --rm findcasa-scraper python test_rmv_scraper.py
        fi

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [test, test-docker]
    if: failure()
    
    steps:
    - name: Notify on failure
      run: |
        echo "Tests failed! Please check the logs above for details."
        echo "Common issues to check:"
        echo "1. Missing dependencies in requirements.txt"
        echo "2. Import errors or path issues"
        echo "3. Configuration file missing or malformed"
        echo "4. Test HTML files missing from test directory"
        exit 1